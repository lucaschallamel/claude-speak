name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 3.10 stays bare (numpy stubbed, like a hook's python3); 3.13 runs the playback
      # tests that need numpy (replay, resume). Same range as server.py's inline deps.
      - if: matrix.python == '3.13'
        run: python -m pip install "numpy>=2,<3"
      - run: python -m unittest discover -v tests
